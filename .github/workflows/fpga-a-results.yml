name: "A: verify full per-epoch logs and archive new angry/happy/neutral model"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fpga-a-results.yml'
  schedule:
    - cron: '11 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fpga-a-result-archive-once
  cancel-in-progress: false

jobs:
  check-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      KERNEL: tyhuanga/fpga-model-a-r1-angry-happy-neutral
      ARTIFACT: FPGA-Model-A-R1-Angry-Happy-Neutral-Max160-EarlyStop12-Logs-and-Weights
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI for read-only status
        run: python -m pip install kaggle
      - name: Obtain actual Kaggle A run status and available epoch log evidence
        id: status
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          remote=$(kaggle kernels status "$KERNEL" 2>&1 || true)
          echo "MODEL_A_KAGGLE_STATE=$remote"
          echo "### New Model A actual status" >>"$GITHUB_STEP_SUMMARY"
          echo "$remote" >>"$GITHUB_STEP_SUMMARY"
          if echo "$remote" | grep -q 'KernelWorkerStatus.COMPLETE'; then
            echo "complete=true" >>"$GITHUB_OUTPUT"
          elif echo "$remote" | grep -q 'KernelWorkerStatus.ERROR'; then
            kaggle kernels logs "$KERNEL" >/tmp/a-error.log 2>&1 || true
            echo "::error::Model A Kaggle failed. Training has NOT been validated."
            echo "=== Actual A error traceback excerpt ==="
            tail -40 /tmp/a-error.log
            exit 1
          elif echo "$remote" | grep -Eq 'KernelWorkerStatus\.(RUNNING|QUEUED|PENDING|CANCEL_REQUESTED)'; then
            kaggle kernels logs "$KERNEL" >/tmp/a-running.log 2>&1 || true
            echo "MODEL_A_AVAILABLE_LOG_BYTES=$(wc -c </tmp/a-running.log)"
            echo "MODEL_A_VISIBLE_EPOCH_EVENTS=$(grep -c 'EPOCH_END' /tmp/a-running.log || true)"
            echo "complete=false" >>"$GITHUB_OUTPUT"
            echo "Queue or task running is NOT proof any epoch is trained." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Model A not yet launched or unknown state; no result claimed."
            echo "complete=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Refuse duplicate result archive
        id: existing
        if: steps.status.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          num=$(gh api '/repos/tyhuang200612-sudo/fpga-emotion-recognition/actions/artifacts?per_page=100' --jq ".artifacts[] | select(.name == \"$ARTIFACT\" and .expired == false) | .id" | head -1)
          if test -n "$num"; then
            echo "::notice::Model A already archived as GitHub artifact $num."
            echo "need=false" >>"$GITHUB_OUTPUT"
          else
            echo "need=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Verify both 80-epoch maximum histories, patience-12 early stop, full logs and weights
        if: steps.status.outputs.complete == 'true' && steps.existing.outputs.need == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p a-finished
          kaggle kernels output "$KERNEL" -p a-finished
          python - <<'PY'
          import json,math
          from pathlib import Path
          roots=list(Path("a-finished").rglob("results.json"))
          assert len(roots)==1,roots
          root=roots[0].parent
          result=json.loads(roots[0].read_text(encoding="utf-8"))
          assert result["project"]=="Model A: angry happy neutral"
          assert result["class_names"]==["angry","happy","neutral"]
          assert result["class_map"]=={"angry":0,"happy":1,"neutral":2}
          assert result["source_policy"]=="fer2013-A-angry-happy-neutral-pixel-audit-v1"
          assert result["seeds"]==[20261021,20261022]
          assert result["max_epochs_per_seed"]==80
          assert result["early_stop_patience"]==12
          assert abs(result["early_stop_min_delta"]-0.001)<1e-10
          assert result["old_neutral_happy_sad_checkpoints_reused"] is False
          assert result["test_evaluated"] is False
          assert result["int8_verified"] is False
          assert result["fpga_verified"] is False
          assert result["phone_camera_verified"] is False
          assert result["no_automatic_deployment"] is True
          assert result["train_size"]>300 and result["val_size"]>300
          actual_epochs=0
          actual_stages=0
          expected_early_stops=0
          for seed in (20261021,20261022):
              record=result["per_seed"][str(seed)]
              count=record["epochs_trained"]
              stages=record["stages_completed"]
              reason=record["stop_reason"]
              assert 12<=count<=80,(seed,count)
              assert stages==math.ceil(count/5),(seed,stages,count)
              if count<80:
                  assert reason=="early_stopping"
                  expected_early_stops+=1
              else:
                  assert reason=="max_epochs"
              actual_epochs+=count
              actual_stages+=stages
              folder=root/f"seed_{seed}"
              model=folder/"best.pt"
              assert model.is_file() and model.stat().st_size>100000
              history=json.loads((folder/"history.json").read_text(encoding="utf-8"))
              assert history["class_names"]==["angry","happy","neutral"]
              assert history["seed"]==seed
              assert len(history["history"])==count
              assert [r["epoch"] for r in history["history"]]==list(range(1,count+1))
              score_by_epoch={r["epoch"]:r["validation"]["macro_f1"] for r in history["history"]}
              assert 1<=record["best_epoch"]<=count
              assert abs(record["validation"]["macro_f1"]-score_by_epoch[record["best_epoch"]])<1e-8
              assert abs(record["validation"]["macro_f1"]-max(score_by_epoch.values()))<1e-5
              for stage in range(1,stages+1):
                  cp=folder/f"stage_{stage:02d}.pt"
                  assert cp.is_file() and cp.stat().st_size>100000
              assert not (folder/f"stage_{stages+1:02d}.pt").exists()
          assert result["total_epochs_completed"]==actual_epochs
          assert result["completed_stages"]==actual_stages
          raw=(root/"live-progress.jsonl").read_text(encoding="utf-8")
          events=[json.loads(t) for t in raw.splitlines() if t.strip()]
          counted={name:sum(e.get("stage")==name for e in events)
              for name in ("GPU_BACKWARD_OK","AUDITED_DATA_READY","EPOCH_END",
                           "STAGE_END","EARLY_STOP","SEED_END","COMPLETE","STAGE_SKIPPED")}
          expected={
              "GPU_BACKWARD_OK":1,"AUDITED_DATA_READY":1,
              "EPOCH_END":actual_epochs,"STAGE_END":actual_stages,
              "EARLY_STOP":expected_early_stops,"SEED_END":2,"COMPLETE":1,
              "STAGE_SKIPPED":32-actual_stages
          }
          assert counted==expected,(counted,expected)
          for seed in (20261021,20261022):
              n=result["per_seed"][str(seed)]["epochs_trained"]
              observed=[e["epoch"] for e in events if e.get("stage")=="EPOCH_END" and e.get("seed")==seed]
              assert observed==list(range(1,n+1)),(seed,len(observed),n)
          print("MODEL A COMPLETE VERIFIED (early stop honored):",counted)
          print("Maximum possible epochs: 160, actual completed:",actual_epochs)
          print("Final A classes:",result["class_names"])
          print("Validation mean Macro-F1:",result["mean_macro_f1"])
          for seed,run in result["per_seed"].items():
              print("SEED",seed,"ACTUAL_EPOCHS",run["epochs_trained"],
                    "STOP_REASON",run["stop_reason"],
                    "BEST_EPOCH",run["best_epoch"],
                    "MACRO_F1",run["validation"]["macro_f1"],
                    "RECALLS",run["validation"]["recall"],
                    "CONFUSION",run["validation"]["confusion_matrix"])
          print("No TEST/camera/FPGA/INT8 proof; scores across old labels NOT comparable.")
          PY
      - name: Save true A model weights and complete training logs as GitHub artifact
        if: steps.status.outputs.complete == 'true' && steps.existing.outputs.need == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FPGA-Model-A-R1-Angry-Happy-Neutral-Max160-EarlyStop12-Logs-and-Weights
          path: a-finished/
          if-no-files-found: error
          retention-days: 30
