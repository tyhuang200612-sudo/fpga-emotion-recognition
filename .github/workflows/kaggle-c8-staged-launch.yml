name: "C8 staged logging GPU launch (safe: wait for old C7)"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kaggle-c8-staged-launch.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fpga-c8-one-private-kaggle-submit
  cancel-in-progress: false

jobs:
  prepare-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      OLD_KERNEL: tyhuanga/fpga-c7-gap2-fixed25-deterministic
      NEW_KERNEL: tyhuanga/fpga-c8-stepwise-log-epochs
    steps:
      - name: Checkout audited C source and staged C8
        uses: actions/checkout@v4

      - name: Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install authenticated Kaggle CLI
        run: python -m pip install kaggle

      - name: Safety gate - no second GPU while C7 is active
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          old=$(kaggle kernels status "$OLD_KERNEL" 2>&1 || true)
          echo "Prior C7: $old"
          if echo "$old" | grep -Eq 'KernelWorkerStatus\.(RUNNING|QUEUED|PENDING|CANCEL_REQUESTED)'; then
            echo "safe_to_launch=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Old C7 is still active. C8 GPU launch deferred, no second GPU started."
            echo "### Waiting safely" >>"$GITHUB_STEP_SUMMARY"
            echo "Old C7 still RUNNING; no duplicate GPU run was started. This short workflow will check again at the next scheduled trigger." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Refuse guessing if Kaggle status is unexpectedly absent/unknown.
          if ! echo "$old" | grep -Eq 'KernelWorkerStatus\.(COMPLETE|ERROR|CANCELLED|CANCEL_ACKNOWLEDGED)'; then
            echo "::error::Unknown old C7 status; refuse overlapping GPU."
            exit 1
          fi
          new=$(kaggle kernels status "$NEW_KERNEL" 2>&1 || true)
          echo "New C8: $new"
          if echo "$new" | grep -q 'KernelWorkerStatus.COMPLETE'; then
            echo "safe_to_launch=false" >>"$GITHUB_OUTPUT"
            echo "archive_ready=true" >>"$GITHUB_OUTPUT"
            echo "::notice::C8 has completed; validate real outputs and archive once."
            exit 0
          fi
          if echo "$new" | grep -Eq 'KernelWorkerStatus\.(RUNNING|QUEUED|PENDING|CANCEL_REQUESTED)'; then
            echo "safe_to_launch=false" >>"$GITHUB_OUTPUT"
            echo "::notice::C8 already running; no new GPU, no long waiting."
            echo "### Already launched" >>"$GITHUB_STEP_SUMMARY"
            echo "C8 is running. Check the Kaggle notebook for completed stage cells." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if echo "$new" | grep -Eq 'KernelWorkerStatus\.(ERROR|CANCELLED|CANCEL_ACKNOWLEDGED)'; then
            echo "::error::Previous C8 failed/was stopped. Manual diagnosis required; no auto-restart."
            exit 1
          fi
          if echo "$new" | grep -q 'KernelWorkerStatus.NEW_SCRIPT'; then
            echo "::notice::C8 notebook prepublished privately with --no-run, now safe to start version."
            echo "safe_to_launch=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if ! echo "$new" | grep -Eqi 'not found|404|does not exist|Kernel not found|No kernels|Cannot access kernel.*Permission.*kernels.get.*was denied'; then
            echo "::error::Unknown new kernel status. Refusing unsafe overwrite."
            exit 1
          fi
          echo "safe_to_launch=true" >>"$GITHUB_OUTPUT"
          echo "### C8 ready for private GPU submission" >>"$GITHUB_STEP_SUMMARY"

      - name: Install CPU PyTorch and prove 20 separately visible stage cells
        if: steps.gate.outputs.safe_to_launch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m unittest discover -s tests -p test_c8_stepwise.py -v
          python -m tools.build_kaggle_c8 --out build/kaggle_c8
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('build/kaggle_c8')
          meta=json.loads((out/'kernel-metadata.json').read_text())
          assert meta['id']=='tyhuanga/fpga-c8-stepwise-log-epochs'
          assert meta['is_private'] and meta['enable_gpu']
          assert set(meta['dataset_sources'])=={
            'msambare/fer2013','tyhuanga/fpga-c2026-locked-baseline',
            'tyhuanga/fpga-c3-locked-teacher'}
          notebook=json.loads((out/meta['code_file']).read_text())
          stages=sum('c8_epochs(5)' in ''.join(c['source']) for c in notebook['cells'])
          assert stages==20 and len(notebook['cells'])==37
          print('C8 private 20-cell staged 100 epoch experiment preflight successful')
          PY

      - name: Confirm frozen private C3 teacher present
        if: steps.gate.outputs.safe_to_launch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          kaggle datasets files tyhuanga/fpga-c3-locked-teacher >/tmp/teacher-files.txt
          grep -q 'c3_teacher-best.pt' /tmp/teacher-files.txt

      - name: Launch C8 one time; no long-running GitHub monitoring
        if: steps.gate.outputs.safe_to_launch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p build/kaggle_c8 --accelerator NvidiaTeslaT4
          state=$(kaggle kernels status "$NEW_KERNEL" 2>&1 || true)
          echo "C8 post-push status: $state"
          echo "### C8 submitted to Kaggle (NOT YET trained)" >>"$GITHUB_STEP_SUMMARY"
          echo "Notebook: https://www.kaggle.com/code/tyhuanga/fpga-c8-stepwise-log-epochs" >>"$GITHUB_STEP_SUMMARY"
          echo "37 cells total including 20 five-Epoch cells. Logs might only be externally downloadable after Kaggle completion." >>"$GITHUB_STEP_SUMMARY"
          if echo "$state" | grep -Eq 'KernelWorkerStatus\.(ERROR|CANCELLED)'; then
            echo "::error::Immediate remote GPU error"
            exit 1
          fi

      - name: Skip re-archiving if previously verified C8 artifact exists
        id: archived
        if: steps.gate.outputs.archive_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Only checks this repository's already authenticated artifact list.
          count=$(gh api '/repos/tyhuang200612-sudo/fpga-emotion-recognition/actions/artifacts?name=TinyCNN-C8-Staged-GAP2-CE-vs-KD-Fixed25-Logs&per_page=100' --jq '.total_count')
          if test "${count:-0}" -gt 0; then
            echo "archive_needed=false" >>"$GITHUB_OUTPUT"
            echo "::notice::C8 complete and already archived. No duplicates."
          else
            echo "archive_needed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Download real finished C8 outputs and validate all 100 epochs
        if: steps.gate.outputs.archive_ready == 'true' && steps.archived.outputs.archive_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c8-final
          kaggle kernels output "$NEW_KERNEL" -p c8-final
          python - <<'PY'
          import json
          from pathlib import Path
          roots=list(Path('c8-final').rglob('results.json'))
          assert len(roots)==1,roots
          root=roots[0].parent
          r=json.loads(roots[0].read_text())
          assert r['student_seeds']==[20261021,20261022]
          assert r['train_val_count']==[13571,2979]
          assert r['quality_policy']=='fer2013-three-class-safe-pixel-dedup-v1'
          assert r['teacher_checkpoint_sha256']=='ce455ee8060e19d87be16d50926c881b672d172c2ea260bf0ad5e01572861b0c'
          assert r['all_four_runs_completed_25_epochs'] and r['all_epochs_total']==100
          assert r['stage_cells_per_model']==5
          assert not r['test_evaluated'] and not r['phone_camera_evaluated'] and r['no_deployment']
          assert not r['int8_fpga_verified']
          for mode in ('GAP2_CE_control','GAP2_C3_KD'):
            for seed in (20261021,20261022):
              folder=root/mode/('seed_'+str(seed))
              assert (folder/'best.pt').stat().st_size>100000
              hist=json.loads((folder/'history.json').read_text())['epochs']
              assert len(hist)==25 and hist[-1]['epoch']==25
              for stage in range(1,6):
                assert (folder/f'stage_{stage:02d}.pt').stat().st_size>100000
          logs=(root/'live-progress.jsonl').read_text()
          assert logs.count('"stage":"C8_EPOCH_END"')==100
          assert logs.count('"stage":"C8_STAGE_DONE"')==20
          assert logs.count('"stage":"C8_VARIANT_DONE"')==4
          assert logs.count('"stage":"C8_COMPLETE"')==1
          print('VERIFIED C8 100 epoch logs and 4 weights:',json.dumps({
            k:{'mean_macro_f1':v['mean_macro_f1'],
               'mean_pair_errors':v['mean_pair_errors'],
               'per_seed':{
                  seed:{'macro_f1':d['validation']['macro_f1'],
                        'neutral_recall':d['validation']['recall']['neutral'],
                        'sad_recall':d['validation']['recall']['sad'],
                        'pair_errors':d['pair_errors']}
                  for seed,d in v['per_seed'].items()}}
            for k,v in r['variants'].items()},indent=2))
          print('Robust upgrade gate:',r['robust_improvement_gate'])
          PY

      - name: Archive proven C8 stage logs, per-epoch metrics, and four checkpoint files
        if: steps.gate.outputs.archive_ready == 'true' && steps.archived.outputs.archive_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TinyCNN-C8-Staged-GAP2-CE-vs-KD-Fixed25-Logs
          path: c8-final/
          if-no-files-found: error
          retention-days: 30
