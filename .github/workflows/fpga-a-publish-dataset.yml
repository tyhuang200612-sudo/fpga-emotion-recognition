name: "A: verify CPU dataset audit and privately publish clean manifests"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fpga-a-publish-dataset.yml'
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpga-a-publish-dataset-once
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      AUDIT: tyhuanga/fpga-a-angry-happy-neutral-dataset-audit
      DATASET: tyhuanga/fpga-a-angry-happy-neutral-clean-v1
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install kaggle
      - name: Require real Kaggle CPU audit completed
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          state=$(kaggle kernels status "$AUDIT" 2>&1 || true)
          echo "A_CPU_AUDIT_STATE=$state"
          if echo "$state" | grep -q 'KernelWorkerStatus.COMPLETE'; then
            echo "complete=true" >>"$GITHUB_OUTPUT"
          elif echo "$state" | grep -q 'KernelWorkerStatus.ERROR'; then
            echo "::error::A dataset audit ERROR; do not upload or start training."
            kaggle kernels logs "$AUDIT" | tail -30 || true
            exit 1
          elif echo "$state" | grep -Eq 'KernelWorkerStatus\.(QUEUED|RUNNING|PENDING)'; then
            echo "complete=false" >>"$GITHUB_OUTPUT"
            echo "::notice::A CPU dataset preparation still running; no GPU."
          else
            echo "::error::Unknown A audit status. Refuse dataset/training."
            exit 1
          fi

      - name: Check if validated private A dataset already exists
        id: private
        if: steps.ready.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status=$(kaggle datasets files "$DATASET" 2>&1 || true)
          echo "A_PRIVATE_DATASET_STATE=$status"
          if echo "$status" | grep -q 'quality-report.json' && echo "$status" | grep -q 'train.csv'; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "::notice::Clean private A dataset already published; no duplicate."
          elif echo "$status" | grep -Eqi 'not found|404|403|Forbidden|does not exist|Permission|was denied|Could not find'; then
            echo "exists=false" >>"$GITHUB_OUTPUT"
          else
            echo "::error::Ambiguous private A dataset state; don't overwrite."
            exit 1
          fi

      - name: Download real A audit and verify all three classes and split hashes
        if: steps.ready.outputs.complete == 'true' && steps.private.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p a-source a-private
          kaggle kernels output "$AUDIT" -p a-source
          python - <<'PY'
          import csv,hashlib,json,shutil
          from pathlib import Path
          match=list(Path("a-source").rglob("quality-report.json"))
          assert len(match)==1,match
          root=match[0].parent
          report=json.loads(match[0].read_text())
          assert report["policy"]=="fer2013-A-angry-happy-neutral-pixel-audit-v1"
          assert report["class_map"]=={"angry":0,"happy":1,"neutral":2}
          assert report["classes"]==["angry","happy","neutral"]
          assert report["original_folder_classes_are_not_relabelled"] is True
          assert report["original_TEST_selection_or_hyperparameter_tuning"] is False
          assert all(report["total_counts"][s]>300 for s in ("train","val","test"))
          pixelsets={}
          for part in ("train","val","test"):
              source=root/f"{part}.csv"
              assert source.is_file()
              assert hashlib.sha256(source.read_bytes()).hexdigest()==report["manifest_sha256"][part]
              with source.open(newline="",encoding="utf-8") as h:
                  rows=list(csv.DictReader(h))
              assert len(rows)==report["total_counts"][part]
              assert {r["label"] for r in rows}=={"angry","happy","neutral"}
              assert all(int(r["label_id"])=={"angry":0,"happy":1,"neutral":2}[r["label"]] for r in rows)
              assert all(r["path"].startswith(("train/" if part!="test" else "test/")+r["label"]+"/") for r in rows)
              pixelsets[part]={r["pixel_sha256"] for r in rows}
              shutil.copy2(source,Path("a-private")/source.name)
          assert not pixelsets["train"]&pixelsets["val"]
          assert not pixelsets["train"]&pixelsets["test"]
          assert not pixelsets["val"]&pixelsets["test"]
          assert hashlib.sha256((root/"test.csv").read_bytes()).hexdigest()==report["heldout_test_sha256"]
          shutil.copy2(match[0],Path("a-private")/"quality-report.json")
          shutil.copy2(root/"audit.json",Path("a-private")/"audit.json")
          print("A DATA AUDIT VERIFIED ON REAL KAGGLE OUTPUT",report["total_counts"])
          print("A CLASS_COUNTS",json.dumps(report["counts"],ensure_ascii=False))
          PY

      - name: Create PRIVATE metadata-only A Kaggle dataset (not public)
        if: steps.ready.outputs.complete == 'true' && steps.private.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          md={
            "title":"FPGA A Angry Happy Neutral Clean Manifests",
            "subtitle":"Audited FER2013 class-specific train validation and heldout test metadata",
            "description":"PRIVATE derived metadata only from msambare/fer2013; original image rights stay with source licensors. No raw images. Explicit angry=0 happy=1 neutral=2. Pixel-level dedup. License: see original dataset terms; no relicensing of images.",
            "id":"tyhuanga/fpga-a-angry-happy-neutral-clean-v1",
            "licenses":[{"name":"other"}],
          }
          (Path("a-private")/"dataset-metadata.json").write_text(json.dumps(md,indent=2)+"\n",encoding="utf-8")
          PY
          # Kaggle defaults to PRIVATE when --public is omitted.
          kaggle datasets create -p a-private -t
          echo "### Verified A dataset published privately" >>"$GITHUB_STEP_SUMMARY"
          echo "Source: https://www.kaggle.com/code/tyhuanga/fpga-a-angry-happy-neutral-dataset-audit" >>"$GITHUB_STEP_SUMMARY"
          echo "Dataset: https://www.kaggle.com/datasets/tyhuanga/fpga-a-angry-happy-neutral-clean-v1" >>"$GITHUB_STEP_SUMMARY"
          kaggle datasets files "$DATASET" | head -30

      - name: Check final Kaggle PRIVATE dataset file existence
        if: steps.ready.outputs.complete == 'true'
        run: |
          set -euo pipefail
          kaggle datasets files "$DATASET" > /tmp/a-dataset-files.txt
          grep -q 'train.csv' /tmp/a-dataset-files.txt
          grep -q 'val.csv' /tmp/a-dataset-files.txt
          grep -q 'test.csv' /tmp/a-dataset-files.txt
          grep -q 'quality-report.json' /tmp/a-dataset-files.txt
          echo "A READY: independently audited metadata available to Model A." >>"$GITHUB_STEP_SUMMARY"
