name: Package trained model for Android browser (no retraining)

on:
  workflow_run:
    workflows:
      - Train FPGA Tiny-CNN on Kaggle T4
    types:
      - completed
  workflow_dispatch:
    inputs:
      training_run_id:
        description: GitHub Actions training run ID (must contain a completed model artifact)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout model exporter and browser UI
        uses: actions/checkout@v4
      - name: Python for CPU ONNX export
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download genuine Kaggle training artifacts
        uses: actions/download-artifact@v4
        with:
          name: tinycnn-fer2013-three-class-model
          path: training-output
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.training_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install CPU-only model export and validation dependencies
        shell: bash
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy onnx onnxruntime
      - name: Export ONNX and validate numerical equivalence
        run: |
          python -m tools.prepare_mobile_package \
            --training-dir training-output \
            --html mobile-test/index.html \
            --out-dir build/mobile-demo-package
      - name: Upload Android browser demo package
        uses: actions/upload-artifact@v4
        with:
          name: fpga-emotion-recognition-phone-test
          path: build/mobile-demo-package/
          if-no-files-found: error
          retention-days: 30
