name: Kaggle FER2013 audit (CPU only, manual)

on:
  workflow_dispatch:
    inputs:
      kaggle_username:
        description: 'Your Kaggle username (not email)'
        type: string
        required: true

permissions:
  contents: read

jobs:
  submit-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_ACCOUNT: ${{ inputs.kaggle_username }}
    steps:
      - name: Verify Kaggle token is configured
        shell: bash
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Missing repo Actions secret KAGGLE_API_TOKEN. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Checkout private GitHub repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package Kaggle CPU audit
        run: python tools/build_kaggle_audit.py --username "$KAGGLE_ACCOUNT"
      - name: Install official Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Submit CPU-only audit to Kaggle
        run: kaggle kernels push -p build/kaggle_fer2013
      - name: Display where to inspect Kaggle job
        run: echo "Open https://www.kaggle.com/code/$KAGGLE_ACCOUNT/fpga-emotion-audit"
