name: Build C2-C phone diagnostic APK (real frozen weights)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-c2c-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fpga-c2c-private-phone-diagnostic
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout Android Camera-C baseline source
        uses: actions/checkout@v4

      - name: Download archived genuine C2-C trained checkpoint
        uses: actions/download-artifact@v4
        with:
          name: TinyCNN-C2-FrozenStructure-Three-Validation-Experiments
          run-id: 38995638992
          github-token: ${{ github.token }}
          path: trained-c2

      - name: Set Python 3.11 for ONNX conversion
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU PyTorch and ONNX test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy onnx onnxruntime

      - name: Verify C2-C distillation origin and export genuine FP32 weights
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import torch
          p=list(Path('trained-c2').rglob('results.json'))
          assert len(p)==1, f'Expected a unique Kaggle C2 result, got {p}'
          root=p[0].parent
          report=json.loads(p[0].read_text())
          assert report['architecture']=='TinyCNN-C 16/32/64/64 UNCHANGED'
          assert report['test_evaluated'] is False
          assert report['required_second_seed'] is True
          assert report['quality_policy']=='fer2013-three-class-safe-pixel-dedup-v1'
          assert set(report['validation'])=={'baseline','A_hard_sampler','B_focal','C_distilled'}
          assert (root/'teacher'/'best.pt').is_file(), 'Teacher checkpoint missing'
          ck=root/'C_distilled'/'best.pt'
          assert ck.is_file() and ck.stat().st_size>100000
          state=torch.load(ck,map_location='cpu',weights_only=True)
          assert state['variant']=='C_distilled'
          assert state['seed']==2026
          assert state['class_names']==['neutral','happy','sad']
          assert state['input_shape']==[1,48,48]
          assert state['epoch']==12
          assert abs(state['val_metrics']['macro_f1']-report['validation']['C_distilled']['macro_f1'])<1e-8
          from src.model_c import TinyCNNC
          model=TinyCNNC()
          model.load_state_dict(state['state_dict'],strict=True)
          (Path('/tmp/c2c-checkpoint.txt')).write_text(str(ck))
          print('Verified C2-C teacher-distilled student best epoch:',state['epoch'])
          print('Only validation metrics are available; this is an experimental phone build.')
          PY
          python -m tools.export_onnx_c --checkpoint "$(cat /tmp/c2c-checkpoint.txt)" --out-dir android-camera-c/app/src/main/assets
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('android-camera-c/app/src/main/assets/model-info.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['onnx_torch_max_abs_diff']<0.0001, d
          assert d['selected_epoch']==12
          assert d['class_names']==['neutral','happy','sad']
          d['model']='TinyCNN-C2-C Distilled Diagnostic (unchanged weights)'
          d['diagnostic_crop_factors']=[1.0,1.15,1.30,1.36,1.40]
          d['default_crop_factor']=1.36
          d['manual_samples_only']=True
          d['no_network_permission']=True
          d['phone_camera_evaluated']=False
          d['variant']='C_distilled'
          d['training_run_id']=38995638992
          d['test_evaluated']=False
          d['fp32_android_camera_experiment']=True
          d['replaces_original_C']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Build independent diagnostic interface and privacy controls
        shell: bash
        run: |
          set -euo pipefail
          cp android-camera-diagnostic/MainActivity.java android-camera-c/app/src/main/java/com/tyhuanga/fpga/camerac/MainActivity.java
          python - <<'PY'
          from pathlib import Path
          g=Path('android-camera-c/app/build.gradle')
          s=g.read_text()
          assert s.count("applicationId 'com.tyhuanga.fpga.camerac'")==1
          assert s.count("versionName '1.0.0-C-2026'")==1
          g.write_text(s.replace("applicationId 'com.tyhuanga.fpga.camerac'",
            "applicationId 'com.tyhuanga.fpga.camerac2cdiag'").replace(
            "versionName '1.0.0-C-2026'","versionName '1.1.0-C2C-Diagnostic'"))
          m=Path('android-camera-c/app/src/main/AndroidManifest.xml')
          x=m.read_text()
          assert 'android:label="FPGA C 实时表情识别"' in x
          x=x.replace('android:label="FPGA C 实时表情识别"','android:label="C2-C 表情诊断"')
          assert "android.permission.INTERNET" not in x
          assert "android.permission.WRITE_EXTERNAL_STORAGE" not in x
          m.write_text(x)
          java=Path('android-camera-c/app/src/main/java/com/tyhuanga/fpga/camerac/MainActivity.java').read_text()
          for required in ('CROP_SCALES','原始预测','平滑预测','ACTION_CREATE_DOCUMENT',
                           'saveSample(int label)','generation++','clearFace(',
                           'ZipOutputStream','cropLuma(', 'addOnCompleteListener'):
              assert required in java,required
          print('Diagnostic UI and no-network app ID checks passed.')
          PY
      - name: Prepare Java 17 and Android SDK 35
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK platform 35
        run: |
          test -d "$ANDROID_HOME/platforms/android-35" || sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build independent debug installable APK
        working-directory: android-camera-c
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify exact distilled ONNX model is embedded
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib,shutil
          from zipfile import ZipFile
          from pathlib import Path
          src=Path('android-camera-c/app/build/outputs/apk/debug/app-debug.apk')
          assert src.is_file() and src.stat().st_size>100000
          with ZipFile(src) as z:
              assert 'assets/model.onnx' in z.namelist()
              assert 'assets/model-info.json' in z.namelist()
              info=json.loads(z.read('assets/model-info.json'))
              assert info['model']=='TinyCNN-C2-C Distilled Diagnostic (unchanged weights)'
              assert info['variant']=='C_distilled'
              assert info['selected_epoch']==12
              assert info['onnx_torch_max_abs_diff']<1e-4
              assert info['manual_samples_only'] and info['no_network_permission']
              assert z.getinfo('assets/model.onnx').file_size>100000
          dist=Path('dist');dist.mkdir(exist_ok=True)
          dst=dist/'TinyCNN-C2C-Phone-Diagnostic-arm64-APK.apk'
          shutil.copyfile(src,dst)
          print('C2-C genuine Android APK:',dst,'size:',dst.stat().st_size,'sha256:',hashlib.sha256(dst.read_bytes()).hexdigest())
          PY

      - name: Publish installable independent C2-C diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: TinyCNN-C2C-Phone-Diagnostic-arm64-APK
          path: dist/TinyCNN-C2C-Phone-Diagnostic-arm64-APK.apk
          if-no-files-found: error
          retention-days: 30
